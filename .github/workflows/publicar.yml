  schedule:
    # Disparo de hora em hora (horarios em UTC; SP = UTC-3). A cada disparo, publica o que ja
    # passou do horario HOJE e ainda nao saiu (pendentes_hoje.py + publicados.json). Antes eram
    # 87 horarios fixos, um por post — o GitHub parou de dispara-los depois de 14/09 (visto em 02/10).
    - cron: "7,37 12-16 * * *"   # 09:07 a 13:37 SP, a cada 30 min (stories 9h, feed 12h, post novo 12h30)
    - cron: "7 17-23 * * *"      # 14:07 a 20:07 SP, de hora em hora (reels das 19h)

permissions:
  contents: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"

      - name: Publicar (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python publicar_nuvem.py "${{ github.event.inputs.slot }}" --dry-run
          else
            python publicar_nuvem.py "${{ github.event.inputs.slot }}"
            python pendentes_hoje.py --marcar "${{ github.event.inputs.slot }}" publicado_manual
            git add publicados.json
            git commit -q -m "Publicado (manual): ${{ github.event.inputs.slot }}"
            git pull -q --rebase && git push -q
          fi

      - name: Publicar o que esta devido hoje
        if: github.event_name == 'schedule'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          falhou=0
          for slot in $(python pendentes_hoje.py); do
            echo "=== $slot ==="
            # Marca ANTES de tentar: se der erro no meio, nao tenta de novo sozinho (evita post
            # repetido); a revisao diaria avisa o que falhou.
            python pendentes_hoje.py --marcar "$slot" tentando
            git add publicados.json && git commit -q -m "Publicando: $slot" && git pull -q --rebase && git push -q
            if python publicar_nuvem.py "$slot"; then
              python pendentes_hoje.py --marcar "$slot" publicado
            else
              python pendentes_hoje.py --marcar "$slot" falhou
              falhou=1
            fi
            git add publicados.json && git commit -q -m "Resultado: $slot" && git pull -q --rebase && git push -q
          done
          exit $falhou
